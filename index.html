<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400;1,600&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--sky1:#0f1236;--sky2:#2b2057;--glow:#e8a0b4;--moon:#f3e6c8;--paper:#f6ecd9;--ink:#3b2f4a;--btn:rgba(243,230,200,.1);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky1:#0a0c26;--sky2:#221945}}
:root[data-theme="dark"]{--sky1:#0a0c26;--sky2:#221945}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 62%,#6b3d62 100%);color:var(--moon);font-family:'Cormorant Garamond',Georgia,serif;overflow-x:hidden;text-align:center}
body::after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.12;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
.stars{position:fixed;inset:0;pointer-events:none}
.stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:var(--moon);animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.15}}
main{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px;gap:8px}
.moon{width:120px;height:120px;border-radius:50%;background:var(--moon);box-shadow:0 0 60px 10px rgba(243,230,200,.35);position:relative;overflow:hidden;margin-bottom:28px;animation:rise 2.2s ease-out both}
.moon::after{content:"";position:absolute;width:104px;height:104px;border-radius:50%;background:var(--sky1);top:-10px;left:-34px;box-shadow:0 0 0 0 transparent}
@keyframes rise{from{transform:translateY(40px);opacity:0}}
h1{font-style:italic;font-weight:400;font-size:clamp(2.6rem,9vw,4.8rem);line-height:1.05;margin:0;letter-spacing:.01em}
.name{font-family:'Caveat',cursive;font-size:clamp(1.8rem,6vw,2.6rem);color:var(--glow);margin:6px 0 0}
.sub{max-width:30ch;margin:18px 0 34px;font-size:1.25rem;line-height:1.5;opacity:.85;font-style:italic}
.btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
button{font:inherit;font-style:italic;font-size:1.2rem;color:var(--moon);background:var(--btn);border:1px solid rgba(243,230,200,.45);border-radius:999px;padding:12px 28px;cursor:pointer;transition:background .25s,transform .25s}
button:hover{background:rgba(232,160,180,.25);transform:translateY(-2px)}
button:focus-visible{outline:2px solid var(--glow);outline-offset:3px}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(8,9,30,.75);backdrop-filter:blur(4px);z-index:5}
.overlay.on{display:flex}
.card{position:relative;width:min(440px,100%);max-height:86vh;overflow:auto;color:var(--ink);text-align:left;animation:pop .5s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{from{transform:translateY(30px) scale(.92) rotate(-2deg);opacity:0}}
.letter{background:var(--paper);padding:34px 30px 30px;border-radius:4px;box-shadow:0 20px 50px rgba(0,0,0,.5);background-image:repeating-linear-gradient(transparent 0 33px,rgba(120,90,140,.16) 33px 34px)}
.letter p{font-family:'Caveat',cursive;font-size:1.6rem;line-height:34px;margin:0 0 34px;white-space:pre-line}
.letter .to{font-weight:600;margin-bottom:0}
.close{position:absolute;top:8px;right:10px;background:none;border:0;color:var(--ink);font-size:1.6rem;padding:4px 10px;font-style:normal}
.close:hover{background:none;transform:none;color:#a0456a}
.ticket{background:var(--paper);border-radius:14px;padding:30px 26px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.5);border:2px dashed #b57a9a;outline:8px solid var(--paper);outline-offset:-1px}
.ticket small{font-size:1.15rem;font-style:italic;font-weight:600;color:#5a3d78}
.ticket h2{font-style:italic;font-weight:600;font-size:2.3rem;line-height:1.1;margin:8px 0 14px;color:#1f1530}
.ticket .fine{font-family:'Caveat',cursive;font-weight:600;font-size:1.7rem;line-height:1.2;margin:0 0 22px;color:#2a1f38}
.ticket button{color:#1f1530;font-weight:600;border-color:#8a4f78;background:rgba(181,122,154,.22)}
.stamp{display:none;font-family:'Caveat',cursive;font-size:1.9rem;color:#a0456a;border:3px solid #a0456a;border-radius:10px;padding:2px 16px;margin:6px auto 0;width:max-content;transform:rotate(-8deg)}
.stamp.on{display:block;animation:st .4s ease-out both}
@keyframes st{from{transform:rotate(-8deg) scale(2.2);opacity:0}}
.card.plain{color:var(--moon)}
.plain .close{position:static;display:block;margin:0 0 8px auto;color:var(--moon)}
.plain .close:hover{color:var(--glow)}
.coupons{display:flex;flex-direction:column;gap:26px;padding:10px 12px 12px}
.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;padding:8px 10px 14px}
.pol{background:var(--paper);padding:10px 10px 12px;border-radius:3px;box-shadow:0 10px 26px rgba(0,0,0,.45);transform:rotate(var(--r))}
.pol:nth-child(even){margin-top:18px}
.pol .ph{aspect-ratio:1;width:100%;object-fit:cover;display:grid;place-items:center;background:linear-gradient(135deg,#d9c3d6,#b9b3dc);color:var(--ink);font-family:'Caveat',cursive;font-size:1.25rem}
.pol p{font-family:'Caveat',cursive;color:var(--ink);font-size:1.35rem;line-height:1.1;margin:8px 0 0;text-align:center}
.now{display:block;width:max-content;max-width:100%;margin:22px auto 0;font-style:italic;font-size:1.1rem;color:var(--moon);opacity:.85;text-decoration:none;border-bottom:1px dotted currentColor}
.now:hover{color:var(--glow)}
.letter .now{color:var(--ink);margin-top:6px}
.player{display:flex;align-items:center;gap:14px;margin:28px auto 0;padding:9px 22px 9px 9px;border-radius:999px;background:rgba(243,230,200,.07);border:1px solid rgba(243,230,200,.25);backdrop-filter:blur(6px);color:var(--moon);box-shadow:0 10px 30px rgba(0,0,0,.35);width:max-content;max-width:100%}
.player button{width:46px;height:46px;padding:0;border-radius:50%;background:linear-gradient(135deg,#b4709a,#7a4a78);border:1px solid rgba(243,230,200,.35);display:grid;place-items:center;color:var(--moon);flex:none}
.player button:hover{background:linear-gradient(135deg,#c682ab,#8c5a8a)}
.player svg{width:20px;height:20px;fill:currentColor}
.player .ic-pause{display:none}
.player.playing .ic-pause{display:block}
.player.playing .ic-play{display:none}
.meta{display:flex;flex-direction:column;text-align:left;line-height:1.15}
.meta b{font-weight:400;font-style:italic;font-size:1.3rem}
.meta span{font-size:1.05rem;color:var(--glow)}
.eq{display:flex;align-items:flex-end;gap:3px;height:20px;margin-left:6px}
.eq i{display:block;width:3px;background:var(--glow);border-radius:2px;transform-origin:bottom}
.eq i:nth-child(1){height:11px}.eq i:nth-child(2){height:18px}.eq i:nth-child(3){height:8px}
.player.playing .eq i{animation:eq .9s ease-in-out infinite}
.player.playing .eq i:nth-child(2){animation-delay:-.3s}
.player.playing .eq i:nth-child(3){animation-delay:-.6s}
@keyframes eq{50%{transform:scaleY(.35)}}
.foot{margin:26px 0 0;font-style:italic;font-size:1.05rem;opacity:.65}
.gate{position:fixed;inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 62%,#6b3d62 100%);transition:opacity .9s ease,visibility .9s}
.gate.out{opacity:0;visibility:hidden}
.gate-stars{position:absolute;inset:0;pointer-events:none}
.gate-stars i{position:absolute;color:var(--moon);font-style:normal;font-size:clamp(12px,2vw,19px);text-shadow:0 0 12px rgba(243,230,200,.8);animation:gate-twinkle 2.8s ease-in-out infinite}
.gate-stars i:nth-child(1){left:27%;top:34%;animation-delay:-.5s}
.gate-stars i:nth-child(2){left:70%;top:30%;font-size:14px;animation-delay:-1.7s}
.gate-stars i:nth-child(3){left:20%;top:55%;font-size:13px;animation-delay:-1s}
.gate-stars i:nth-child(4){left:78%;top:52%;animation-delay:-2.1s}
.gate-stars i:nth-child(5){left:31%;top:71%;font-size:12px;animation-delay:-1.3s}
.gate-stars i:nth-child(6){left:68%;top:73%;font-size:13px;animation-delay:-.8s}
@keyframes gate-twinkle{0%,100%{opacity:.35;transform:scale(.75)}50%{opacity:1;transform:scale(1.15)}}
.gate>:not(.gate-stars){position:relative;z-index:1}
.gmoon{width:84px;height:84px;border-radius:50%;background:var(--moon);box-shadow:0 0 50px 8px rgba(243,230,200,.4);margin-bottom:20px;animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 90px 22px rgba(243,230,200,.6)}}
.gate .gto{font-family:'Caveat',cursive;font-size:2.4rem;color:var(--glow);margin:0}
.gate .gsub{font-style:italic;font-size:1.3rem;opacity:.85;margin:0 0 22px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="stars" id="stars" aria-hidden="true"></div>
<div class="gate" id="gate">
  <div class="gate-stars" aria-hidden="true">
    <i>✦</i><i>✧</i><i>✧</i><i>✦</i><i>✦</i><i>✧</i>
  </div>
  <div class="gmoon" aria-hidden="true"></div>
  <p class="gto">for Wella</p>
  <p class="gsub">something small, made for you</p>
  <button id="enter">tap to open</button>
</div>
<main>
  <div class="moon" aria-hidden="true"></div>
  <h1>happy birthday</h1>
  <p class="name" id="nm"></p>
  <p class="sub">i made you two small things. open them when you’re ready.</p>
  <div class="btns">
    <button id="bl">open my letter</button>
    <button id="bg">our pictures</button>
    <button id="bc">your coupons</button>
  </div>
  <div class="player" data-song="24">
    <button class="player-toggle" aria-label="Play or pause 24"><svg class="ic-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><svg class="ic-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg></button>
    <div class="meta"><b>24</b><span>NIKI</span></div>
    <div class="eq" aria-hidden="true"><i></i><i></i><i></i></div>
  </div>
  <p class="foot">made with love</p>
</main>

<div class="overlay" id="ol" role="dialog" aria-modal="true" aria-label="Letter">
  <div class="card letter">
    <button class="close" data-close aria-label="Close">×</button>
    <p class="to" id="lto"></p>
    <p id="lbody"></p>
    <p id="lfrom"></p>
  </div>
</div>

<div class="overlay" id="oc" role="dialog" aria-modal="true" aria-label="Coupons">
  <div class="card plain">
    <button class="close" data-close aria-label="Close">×</button>
    <div class="coupons" id="clist"></div>
  </div>
</div>

<div class="overlay" id="og" role="dialog" aria-modal="true" aria-label="Pictures">
  <div class="card plain">
    <button class="close" data-close aria-label="Close">×</button>
    <div class="gal" id="glist"></div>
  </div>
</div>

<script>
// ✏️ EDIT YOUR TEXT HERE
const CONFIG = {
  name: "for Wella",
  letterTo: "Dear Wella,",
  letter: "I wanted to write you something, but you know that I don't usually do this type of stuff, so I don't know how and where to start. I just wanna greet you a happy birthday!\n\nThank you for being such a good friend, even when I don't show up recently. Basta I'm always here, Wella, when you need someone to talk to or when your emotions are eating you up and you want to do random things—just message me lang.\n\nI miss you, Wella! Bond tayo soon ulit, SHS Wella, sana.",
  letterFrom: "",
  coupons: [
    { top: "good for one", title: "invite me anywhere, anytime", fine: "no reason needed. just say the word and i’ll be there.", done: "see you soon" },
    { top: "good for one", title: "moshi manju, my treat", fine: "one round of moshi manju on me. you pick the flavor.", done: "yum" },
    { top: "good for one", title: "shawarma rice, my treat", fine: "one shawarma rice, extra sauce included. you pick the day.", done: "enjoy" }
  ],
  photos: [
    { src: "firstpic.jpg", cap: "our first pic" },
    { src: "randomgames.jpg", cap: "our random games" },
    { src: "bday.jpg", cap: "your birthday" },
    { src: "grad.jpg", cap: "your graduation" }
  ]
};

document.getElementById('nm').textContent = CONFIG.name;
document.getElementById('lto').textContent = CONFIG.letterTo;
document.getElementById('lbody').textContent = CONFIG.letter;
document.getElementById('lfrom').textContent = CONFIG.letterFrom;
CONFIG.coupons.forEach(c => {
  const t = document.createElement('div');
  t.className = 'ticket';
  t.innerHTML = '<small></small><h2></h2><p class="fine"></p><button>redeem</button><div class="stamp"></div>';
  t.querySelector('small').textContent = c.top;
  t.querySelector('h2').textContent = c.title;
  t.querySelector('.fine').textContent = c.fine;
  t.querySelector('.stamp').textContent = c.done;
  const b = t.querySelector('button');
  b.onclick = () => { b.style.display = 'none'; t.querySelector('.stamp').classList.add('on'); };
  document.getElementById('clist').appendChild(t);
});
CONFIG.photos.forEach((p, i) => {
  const f = document.createElement('div');
  f.className = 'pol';
  f.style.setProperty('--r', ((i % 2 ? 1 : -1) * (1 + (i % 3))) + 'deg');
  let im;
  if (p.src) { im = document.createElement('img'); im.src = p.src; im.alt = p.cap; im.className = 'ph'; }
  else { im = document.createElement('div'); im.className = 'ph'; im.textContent = 'your photo here'; }
  const cp = document.createElement('p');
  cp.textContent = p.cap;
  f.append(im, cp);
  document.getElementById('glist').appendChild(f);
});

const st = document.getElementById('stars');
for (let i = 0; i < 60; i++) {
  const s = document.createElement('i');
  s.style.left = Math.random() * 100 + '%';
  s.style.top = Math.random() * 100 + '%';
  s.style.animationDelay = (Math.random() * 3) + 's';
  s.style.opacity = .4 + Math.random() * .6;
  st.appendChild(s);
}

const SONGS = {
  "24": { src: "NIKI - 24 (Lyrics).mp3", startAt: 12 },
  "Anaheim": { src: "NIKI - Anaheim (Lyrics).mp3", startAt: 19 },
  "Every Summertime": { src: "NIKI - Every Summertime (Visualizer).mp3", startAt: 24 },
  "High School in Jakarta": { src: "NIKI - High School in Jakarta (Official Music Video).mp3", startAt: 63 }
};
const songAudios = new Map();
const songPlayers = new Map();
let activeSong = null;
document.querySelectorAll('.player[data-song]').forEach(player => {
  const song = player.dataset.song;
  if (!songPlayers.has(song)) songPlayers.set(song, []);
  songPlayers.get(song).push(player);
  player.querySelector('.player-toggle').addEventListener('click', () => {
    const audio = songAudios.get(song);
    if (audio && !audio.paused && activeSong === song) {
      audio.pause();
    } else {
      playSong(song);
    }
  });
});
Object.entries(SONGS).forEach(([name, track]) => {
  const audio = new Audio(track.src);
  audio.preload = 'auto';
  audio.addEventListener('loadedmetadata', () => {
    if (activeSong === name && audio.currentTime < track.startAt) {
      audio.currentTime = Math.min(track.startAt, audio.duration);
    }
  });
  audio.addEventListener('play', () => {
    if (activeSong === name) {
      songPlayers.get(name)?.forEach(player => player.classList.add('playing'));
    }
  });
  audio.addEventListener('pause', () => {
    songPlayers.get(name)?.forEach(player => player.classList.remove('playing'));
  });
  audio.addEventListener('ended', () => songPlayers.get(name)?.forEach(player => player.classList.remove('playing')));
  audio.addEventListener('error', () => console.error('Unable to load audio file: ' + track.src, audio.error));
  songAudios.set(name, audio);
});
const stopSongs = () => {
  songAudios.forEach(audio => audio.pause());
  document.querySelectorAll('.player.playing').forEach(player => player.classList.remove('playing'));
};
const playSong = name => {
  const audio = songAudios.get(name);
  const track = SONGS[name];
  if (!audio || !track) return;
  stopSongs();
  activeSong = name;
  if (audio.readyState >= 1) audio.currentTime = Math.min(track.startAt, audio.duration || track.startAt);
  audio.play().catch(error => console.error('Unable to play ' + name + ':', error));
};

const gate = document.getElementById('gate');
document.getElementById('enter').addEventListener('click', () => {
  gate.classList.add('out');
  setTimeout(() => gate.remove(), 1000);
  playSong('24');
});
const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
const moonEl = document.querySelector('.moon');
const hues = ['#f3e6c8', '#e8a0b4', '#c9b6ff'];
document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b || reduce || b.closest('.player')) return;
  const rc = b.getBoundingClientRect();
  const x = e.clientX || rc.left + rc.width / 2, y = e.clientY || rc.top + rc.height / 2;
  const base = 'position:fixed;pointer-events:none;z-index:20;left:' + x + 'px;top:' + y + 'px;';
  const ring = document.createElement('div');
  ring.style.cssText = base + 'width:30px;height:30px;border-radius:50%;border:1px solid #f3e6c8;transform:translate(-50%,-50%)';
  document.body.appendChild(ring);
  ring.animate([{transform:'translate(-50%,-50%) scale(.3)',opacity:.9},{transform:'translate(-50%,-50%) scale(4.5)',opacity:0}], {duration:900, easing:'ease-out'}).onfinish = () => ring.remove();
  for (let i = 0; i < 18; i++) {
    const s = document.createElement('div'), z = 6 + Math.random() * 10;
    s.style.cssText = base + 'width:' + z + 'px;height:' + z + 'px;background:' + hues[i % 3] + ';clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);filter:drop-shadow(0 0 4px ' + hues[i % 3] + ')';
    document.body.appendChild(s);
    const dx = (Math.random() - .5) * 190, dy = -30 - Math.random() * 130, rot = (Math.random() - .5) * 240;
    s.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:'translate(calc(-50% + ' + dx + 'px),calc(-50% + ' + dy + 'px)) rotate(' + rot + 'deg) scale(0)',opacity:0}], {duration:900 + Math.random() * 600, easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish = () => s.remove();
  }
  moonEl.animate([{boxShadow:'0 0 60px 10px rgba(243,230,200,.35)'},{boxShadow:'0 0 120px 35px rgba(243,230,200,.75)'},{boxShadow:'0 0 60px 10px rgba(243,230,200,.35)'}], {duration:1000});
});
const ol = document.getElementById('ol'), oc = document.getElementById('oc'), og = document.getElementById('og');
const openSection = (overlay, song) => {
  [ol, oc, og].forEach(section => section.classList.remove('on'));
  overlay.classList.add('on');
  if (song) playSong(song);
  else stopSongs();
};
document.getElementById('bl').onclick = () => openSection(ol, 'Anaheim');
document.getElementById('bc').onclick = () => openSection(oc, 'Every Summertime');
document.getElementById('bg').onclick = () => openSection(og, 'High School in Jakarta');
[ol, oc, og].forEach(o => o.addEventListener('click', e => {
  if (e.target === o || e.target.hasAttribute('data-close')) {
    o.classList.remove('on');
    stopSongs();
  }
}));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    ol.classList.remove('on');
    oc.classList.remove('on');
    og.classList.remove('on');
    stopSongs();
  }
});
</script>
</body>
</html>
